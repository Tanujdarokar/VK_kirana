<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
  <title>POS Counter Billing - VK Kirana</title>
  <meta name="description" content="Counter POS billing system for retail kirana stores." />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/admin.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="admin-wrapper">
    <!-- Shared Sidebar -->
    <div id="admin-sidebar-container"></div>

    <!-- Content Area -->
    <div class="admin-content-area">
      <!-- Shared Topbar -->
      <div id="admin-topbar-container"></div>

      <!-- POS Main Container -->
      <div class="admin-main-body" style="padding: 20px;">
        <div class="pos-container">
          
          <!-- Left: Product Catalog & Quick Add -->
          <div class="pos-catalog-panel">
            <div class="pos-search-bar">
              <input
                type="text"
                id="pos-search-input"
                placeholder="Scan barcode or type item name (atta, milk, oil, dal)..."
                style="flex: 1; padding: 10px 14px; border-radius: 10px; font-size: 0.92rem;"
              />
              <button id="pos-barcode-sim-btn" class="btn btn-outline btn-sm" title="Simulate Barcode Scan">
                <i data-lucide="scan"></i>
                <span class="hide-on-mobile">Barcode Scan</span>
              </button>
            </div>

            <!-- Quick Category Filter Pills -->
            <div id="pos-cat-pills" style="display: flex; gap: 8px; padding: 10px 16px; background: white; border-bottom: 1px solid #e2e8f0; overflow-x: auto; white-space: nowrap;">
              <!-- Populated dynamically -->
            </div>

            <!-- Products Grid for 1-click addition -->
            <div id="pos-products-grid" class="pos-products-grid">
              <!-- Populated dynamically -->
            </div>
          </div>

          <!-- Right: Counter Bill Cart -->
          <div class="pos-cart-panel">
            <div style="padding: 16px; background: #0f172a; color: white; display: flex; align-items: center; justify-content: space-between;">
              <div>
                <div style="font-weight: 900; font-size: 1.1rem;">Counter Bill</div>
                <div style="font-size: 0.75rem; color: #34d399;">Order #<span id="pos-bill-id">TXN-000</span></div>
              </div>
              <button id="pos-clear-bill-btn" style="background: rgba(255,255,255,0.1); color: #fee2e2; border: none; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; cursor: pointer;">
                Clear
              </button>
            </div>

            <!-- Customer Details -->
            <div style="padding: 12px 16px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; gap: 10px;">
              <input type="text" id="pos-cust-name" placeholder="Customer Name (Optional)" style="flex: 1; padding: 7px 10px; font-size: 0.85rem; border-radius: 8px;" />
              <input type="tel" id="pos-cust-phone" placeholder="Phone" style="width: 120px; padding: 7px 10px; font-size: 0.85rem; border-radius: 8px;" />
            </div>

            <!-- Bill Items List -->
            <div id="pos-bill-items-list" style="flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px;">
              <!-- Populated dynamically -->
            </div>

            <!-- Payment Calculator & Checkout -->
            <div style="padding: 16px; background: #f8fafc; border-top: 1px solid #e2e8f0;">
              <!-- Subtotal & Profit -->
              <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px;">
                <span style="font-size: 0.9rem; font-weight: 700; color: #475569;">Total Amount:</span>
                <span id="pos-bill-total" style="font-size: 1.5rem; font-weight: 900; color: #059669;">₹0</span>
              </div>

              <!-- Payment Mode -->
              <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px;">
                <label style="padding: 6px; border: 1.5px solid #059669; border-radius: 8px; text-align: center; font-size: 0.8rem; font-weight: 800; color: #064e3b; background: #ecfdf5; cursor: pointer;">
                  <input type="radio" name="pos-pay-mode" value="cash" checked style="display: none;" />
                  💵 Cash
                </label>
                <label style="padding: 6px; border: 1px solid #cbd5e1; border-radius: 8px; text-align: center; font-size: 0.8rem; font-weight: 700; color: #334155; cursor: pointer;">
                  <input type="radio" name="pos-pay-mode" value="upi" style="display: none;" />
                  📱 UPI / QR
                </label>
                <label style="padding: 6px; border: 1px solid #cbd5e1; border-radius: 8px; text-align: center; font-size: 0.8rem; font-weight: 700; color: #334155; cursor: pointer;">
                  <input type="radio" name="pos-pay-mode" value="khata" style="display: none;" />
                  📖 Khata
                </label>
              </div>

              <!-- Cash Tendered & Change -->
              <div id="pos-cash-calc-row" style="display: flex; gap: 10px; margin-bottom: 12px;">
                <div style="flex: 1;">
                  <label style="display: block; font-size: 0.72rem; font-weight: 700; color: #64748b; margin-bottom: 2px;">Cash Received</label>
                  <input type="number" id="pos-cash-received" placeholder="₹0" style="width: 100%; padding: 6px 10px; border-radius: 8px; font-weight: 800;" />
                </div>
                <div style="flex: 1;">
                  <label style="display: block; font-size: 0.72rem; font-weight: 700; color: #64748b; margin-bottom: 2px;">Change to Return</label>
                  <div id="pos-change-returned" style="padding: 6px 10px; background: white; border: 1px solid #cbd5e1; border-radius: 8px; font-weight: 900; color: #ef4444;">₹0</div>
                </div>
              </div>

              <button id="pos-complete-sale-btn" class="btn btn-primary" style="width: 100%; padding: 12px; font-weight: 900; font-size: 1rem;">
                ✓ Complete Sale & Print Bill
              </button>
            </div>

          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Receipt Print Modal -->
  <div id="pos-receipt-modal" class="modal-backdrop" style="display: none;">
    <div class="modal-card" style="max-width: 400px; padding: 24px; font-family: monospace;">
      <div style="text-align: center; border-bottom: 1px dashed #000; padding-bottom: 12px; margin-bottom: 12px;">
        <h3 style="font-size: 1.2rem; font-weight: 900; margin-bottom: 2px;">VK KIRANA & SUPERMARKET</h3>
        <p style="font-size: 0.75rem;">Mandi Market Gate 1, Koramangala, BLR</p>
        <p style="font-size: 0.75rem;">GSTIN: 29AABCV1234F1Z9 • Ph: 9811122233</p>
        <div style="font-size: 0.75rem; margin-top: 4px;" id="receipt-date-time"></div>
      </div>

      <div id="receipt-items-table" style="font-size: 0.8rem; margin-bottom: 12px;">
        <!-- Receipt items -->
      </div>

      <div style="border-top: 1px dashed #000; padding-top: 8px; font-size: 0.85rem; margin-bottom: 14px;">
        <div style="display: flex; justify-content: space-between; font-weight: 900;">
          <span>GRAND TOTAL:</span>
          <span id="receipt-grand-total">₹0</span>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 0.75rem; margin-top: 4px;">
          <span>Payment Mode:</span>
          <span id="receipt-pay-mode">CASH</span>
        </div>
      </div>

      <div style="text-align: center; font-size: 0.75rem; color: #475569; margin-bottom: 16px;">
        Thank You! Phir Padhariye 🙏<br />VK Kirana Express Counter
      </div>

      <div style="display: flex; gap: 8px;">
        <button id="pos-print-now-btn" class="btn btn-primary btn-sm" style="flex: 1;">
          🖨️ Print Receipt
        </button>
        <button id="pos-close-receipt-btn" class="btn btn-outline btn-sm">
          Close
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="./js/pages/admin-pos.js"></script>
</body>
</html>
