<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <title>Demo Profile Access - VKCommerce</title>
  <meta name="description" content="Open a browser-only VKCommerce demo customer or store-owner profile." />
  <meta name="robots" content="noindex,follow" />
  <link rel="stylesheet" href="./css/style.css" />
  <script src="https://unpkg.com/lucide@latest" defer></script>
</head>
<body style="background: #f1f5f9; min-height: 100vh; display: flex; flex-direction: column;">
  <!-- Common Navbar Shell -->
  <div id="vk-navbar-container"></div>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 16px;">
    <div class="card" style="max-width: 460px; width: 100%; padding: 36px 32px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08);">
      
      <!-- Brand Heading -->
      <div style="text-align: center; margin-bottom: 24px;">
        <div style="width: 48px; height: 48px; border-radius: 14px; background: #059669; color: white; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; box-shadow: 0 6px 16px rgba(5, 150, 105, 0.35);">
          <i data-lucide="shopping-bag" style="width: 24px; height: 24px;"></i>
        </div>
        <h1 style="font-size: 1.6rem; font-weight: 900; color: #0f172a;">Welcome to VK Kirana</h1>
        <p style="color: #64748b; font-size: 0.88rem; margin-top: 4px;">Sign in to your customer account or store management portal</p>
      </div>

      <!-- 1-Click Demo Buttons (Super convenient for testing) -->
      <div style="background: #f8fafc; border-radius: 14px; padding: 14px; margin-bottom: 24px; border: 1px solid #e2e8f0;">
        <div style="font-size: 0.75rem; font-weight: 800; color: #64748b; text-transform: uppercase; margin-bottom: 8px; text-align: center;">
          ⚡ Instant Demo Logins
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <button type="button" id="demo-customer-login-btn" class="btn btn-outline btn-sm" style="background: white; justify-content: center; font-weight: 700;">
            🛒 1-Click Customer Demo (Tanuj)
          </button>
          <button type="button" id="demo-vendor-login-btn" class="btn btn-primary btn-sm" style="background: #0f172a; border-color: #1e293b; justify-content: center; font-weight: 700;">
            🏪 1-Click Store Owner Demo (Vijay POS & Khata)
          </button>
        </div>
      </div>

      <div role="note" style="background: #fff7ed; color: #7c2d12; border: 1px solid #fdba74; border-radius: 12px; padding: 12px; font-size: 0.85rem; line-height: 1.5;">
        Demo only: account data stays in this browser and is not protected by a server. Password sign-in is unavailable; do not enter real or sensitive information.
      </div>

      <div style="margin-top: 20px; text-align: center; font-size: 0.88rem; color: #64748b;">
        New to VK Kirana?
        <a href="register.html" style="color: #047857; font-weight: 800; text-decoration: underline;">
          Create Demo Profile
        </a>
      </div>

    </div>
  </main>

  <!-- Common Footer Shell -->
  <div id="vk-footer-container"></div>

  <!-- Page Logic Script -->
  <script type="module" src="./js/pages/auth.js"></script>
</body>
</html>
