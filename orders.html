<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
  <title>My Orders - VKCommerce</title>
  <meta name="description" content="View and track your previous grocery orders." />
  <link rel="stylesheet" href="./css/style.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <!-- Common Navbar Shell -->
  <div id="vk-navbar-container"></div>

  <main style="padding: 32px 0 60px;">
    <div class="container" style="max-width: 900px;">
      <!-- Breadcrumb -->
      <div style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #64748b; margin-bottom: 16px;">
        <a href="index.html" style="color: #059669; font-weight: 600;">Home</a>
        <span>›</span>
        <span style="font-weight: 700; color: #0f172a;">Order History</span>
      </div>

      <div style="margin-bottom: 24px;">
        <h1 style="font-size: 1.85rem; font-weight: 900; color: #0f172a;">My Grocery Orders</h1>
        <p style="color: #64748b; font-size: 0.9rem;">View past deliveries, re-order daily essentials, or track live orders</p>
      </div>

      <!-- Orders List Container -->
      <div id="orders-list-container" style="display: flex; flex-direction: column; gap: 20px;">
        <!-- Populated dynamically -->
      </div>

      <!-- Empty State -->
      <div id="orders-empty-state" class="card" style="display: none; padding: 60px 24px; text-align: center; border-radius: 24px;">
        <div style="font-size: 4rem; margin-bottom: 16px;">📦</div>
        <h2 style="font-size: 1.4rem; font-weight: 800; color: #0f172a; margin-bottom: 8px;">No Orders Placed Yet</h2>
        <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 24px;">
          When you order fresh groceries and staples, your invoices and live tracking will appear here.
        </p>
        <a href="products.html" class="btn btn-primary" style="margin: 0 auto;">
          Start Shopping Essentials
        </a>
      </div>

    </div>
  </main>

  <!-- Common Footer Shell -->
  <div id="vk-footer-container"></div>

  <!-- Page Logic Script -->
  <script type="module" src="./js/pages/orders.js"></script>
</body>
</html>
