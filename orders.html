<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <title>My Orders - Apni Kirana</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="container">
      <div class="top-bar-left"><span><i class="fas fa-truck-fast"></i> 15-Min Instant Kirana Delivery</span></div>
      <div class="top-bar-right">
        <div class="lang-switcher">
          <button class="lang-btn active" data-lang="en">English</button>
          <button class="lang-btn" data-lang="hi">हिंदी</button>
        </div>
        <button class="theme-toggle-btn"><i class="fas fa-moon"></i></button>
      </div>
    </div>
  </div>

  <!-- Navbar -->
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo-brand">
        <div class="logo-icon"><i class="fas fa-shopping-basket"></i></div>
        <div class="logo-text">
          <h1 data-i18n="siteName">Apni Kirana</h1>
          <span data-i18n="tagline">Aapki Apni Dukan, Ab Online!</span>
        </div>
      </a>
      <div class="nav-actions">
        <a href="cart.html" class="btn btn-primary"><i class="fas fa-shopping-cart"></i> Cart</a>
      </div>
    </div>
  </header>

  <main style="padding: 40px 0 80px;">
    <div class="container" style="max-width: 900px;">

      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <div>
          <h1 style="font-size: 1.8rem; font-weight: 800;">My Kirana Orders</h1>
          <p style="color: var(--text-muted); font-size: 0.88rem;">Review past grocery orders and track live deliveries</p>
        </div>
        <a href="shop.html" class="btn btn-outline btn-sm"><i class="fas fa-plus"></i> New Order</a>
      </div>

      <div id="orders-list-wrap" style="display: flex; flex-direction: column; gap: 20px;"></div>

    </div>
  </main>

  <footer class="footer"><div class="container"><div class="footer-bottom">© 2025 Apni Kirana</div></div></footer>

  <script src="./js/language.js"></script>
  <script src="./js/products.js"></script>
  <script src="./js/cart.js"></script>
  <script src="./js/checkout.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/main.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const wrap = document.getElementById('orders-list-wrap');
      if (!wrap || !window.Checkout) return;

      const orders = window.Checkout.getOrders();

      if (orders.length === 0) {
        wrap.innerHTML = `
          <div class="card" style="padding: 50px; text-align: center;">
            <i class="fas fa-box-open" style="font-size: 3rem; color: var(--text-muted); margin-bottom: 16px;"></i>
            <h2>No Orders Found</h2>
            <p style="color: var(--text-muted); margin: 8px 0 20px;">You haven't placed any grocery orders yet.</p>
            <a href="shop.html" class="btn btn-primary">Start Shopping</a>
          </div>
        `;
        return;
      }

      wrap.innerHTML = orders.map(o => `
        <div class="card" style="padding: 24px;">
          <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 16px; flex-wrap: wrap; gap: 10px;">
            <div>
              <strong style="font-size: 1.05rem;">Order #${o.id}</strong>
              <div style="font-size: 0.8rem; color: var(--text-muted);">${new Date(o.date).toLocaleString()}</div>
            </div>
            <span class="badge" style="background: var(--secondary-color); color: var(--primary-dark); font-size: 0.82rem; padding: 4px 10px;">● ${o.status}</span>
          </div>

          <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px;">
            ${o.items.map(i => `
              <div style="display: flex; justify-content: space-between; font-size: 0.88rem;">
                <span>${i.quantity}x ${i.name} (${i.unit})</span>
                <strong>₹${i.subtotal}</strong>
              </div>
            `).join('')}
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 12px; flex-wrap: wrap; gap: 10px;">
            <div>
              <span style="font-size: 0.82rem; color: var(--text-muted);">Paid via ${o.paymentMethod} • </span>
              <strong style="font-size: 1.1rem; color: var(--primary-color);">Total: ₹${o.totalAmount}</strong>
            </div>

            <div style="display: flex; gap: 8px;">
              <a href="track-order.html?orderId=${o.id}" class="btn btn-primary btn-sm">
                <i class="fas fa-truck-fast"></i> Track Order
              </a>
            </div>
          </div>
        </div>
      `).join('');
    });
  </script>
</body>
</html>
