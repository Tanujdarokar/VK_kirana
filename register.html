<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <title>Register - Apni Kirana</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="container">
      <div class="top-bar-left"><span><i class="fas fa-truck-fast"></i> 15-Min Instant Kirana Delivery</span></div>
      <div class="top-bar-right">
        <div class="lang-switcher">
          <button class="lang-btn active" data-lang="en">English</button>
          <button class="lang-btn" data-lang="hi">हिंदी</button>
        </div>
        <button class="theme-toggle-btn"><i class="fas fa-moon"></i></button>
      </div>
    </div>
  </div>

  <!-- Navbar -->
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo-brand">
        <div class="logo-icon"><i class="fas fa-shopping-basket"></i></div>
        <div class="logo-text">
          <h1 data-i18n="siteName">Apni Kirana</h1>
          <span data-i18n="tagline">Aapki Apni Dukan, Ab Online!</span>
        </div>
      </a>
      <div class="nav-actions">
        <a href="index.html" class="btn btn-outline"><i class="fas fa-house"></i> Home</a>
      </div>
    </div>
  </header>

  <main style="padding: 50px 20px 80px; display: flex; align-items: center; justify-content: center;">
    <div class="card" style="max-width: 460px; width: 100%; padding: 36px 28px;">
      
      <div style="text-align: center; margin-bottom: 24px;">
        <div style="width: 52px; height: 52px; border-radius: var(--radius-md); background: var(--primary-color); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 12px;">
          <i class="fas fa-user-plus"></i>
        </div>
        <h1 style="font-size: 1.5rem; font-weight: 800;" data-i18n="registerTitle">Create Free Customer Account</h1>
        <p style="color: var(--text-muted); font-size: 0.85rem;">Join Apni Kirana for instant 15-min grocery deliveries</p>
      </div>

      <form id="register-form" style="display: flex; flex-direction: column; gap: 14px;">
        <div>
          <label style="font-size: 0.8rem; font-weight: 700;">Full Name *</label>
          <input type="text" id="reg-name" required placeholder="e.g. Harsh Sharma" style="width: 100%; padding: 10px 12px; border-radius: var(--radius-sm);" />
        </div>

        <div>
          <label style="font-size: 0.8rem; font-weight: 700;">Email Address *</label>
          <input type="email" id="reg-email" required placeholder="name@example.com" style="width: 100%; padding: 10px 12px; border-radius: var(--radius-sm);" />
        </div>

        <div>
          <label style="font-size: 0.8rem; font-weight: 700;">Mobile Phone Number (10 digits) *</label>
          <input type="tel" id="reg-phone" required pattern="[0-9]{10}" placeholder="9876543210" style="width: 100%; padding: 10px 12px; border-radius: var(--radius-sm);" />
        </div>

        <div>
          <label style="font-size: 0.8rem; font-weight: 700;">Password (Min. 6 chars) *</label>
          <input type="password" id="reg-password" required minlength="6" placeholder="••••••••" style="width: 100%; padding: 10px 12px; border-radius: var(--radius-sm);" />
        </div>

        <div>
          <label style="font-size: 0.8rem; font-weight: 700;">Confirm Password *</label>
          <input type="password" id="reg-confirm-password" required minlength="6" placeholder="••••••••" style="width: 100%; padding: 10px 12px; border-radius: var(--radius-sm);" />
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 6px;">Create Customer Account</button>
      </form>

      <div style="text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--text-muted);">
        Already registered? <a href="login.html" style="color: var(--primary-color); font-weight: 700;">Sign In Here</a>
      </div>
    </div>
  </main>

  <footer class="footer"><div class="container"><div class="footer-bottom">© 2025 Apni Kirana</div></div></footer>

  <script src="./js/language.js"></script>
  <script src="./js/products.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/main.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('register-form')?.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('reg-name').value;
        const email = document.getElementById('reg-email').value;
        const phone = document.getElementById('reg-phone').value;
        const pass = document.getElementById('reg-password').value;
        const confirmPass = document.getElementById('reg-confirm-password').value;

        if (pass !== confirmPass) {
          if (window.showToast) window.showToast("Passwords do not match!", "error");
          return;
        }

        const newUser = window.Auth.register({ name, email, phone, password: pass });
        if (newUser) {
          window.location.href = "profile.html";
        }
      });
    });
  </script>
</body>
</html>
