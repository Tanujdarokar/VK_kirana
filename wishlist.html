<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <title>My Wishlist - VKCommerce</title>
  <meta name="description" content="View saved groceries and favorite items." />
  <meta name="robots" content="noindex,follow" />
  <link rel="stylesheet" href="./css/style.css" />
  <script src="https://unpkg.com/lucide@latest" defer></script>
</head>
<body>
  <!-- Common Navbar Shell -->
  <div id="vk-navbar-container"></div>

  <main style="padding: 32px 0 60px;">
    <div class="container">
      <!-- Breadcrumb -->
      <div style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #64748b; margin-bottom: 16px;">
        <a href="index.html" style="color: #047857; font-weight: 600;">Home</a>
        <span>›</span>
        <span style="font-weight: 700; color: #0f172a;">My Saved Items</span>
      </div>

      <div style="margin-bottom: 24px;">
        <h1 style="font-size: 1.85rem; font-weight: 900; color: #0f172a;">Saved Grocery Items</h1>
        <p style="color: #64748b; font-size: 0.9rem;">Items you saved for your upcoming monthly or weekly dukan refill</p>
      </div>

      <!-- Wishlist Grid -->
      <div id="wishlist-products-grid" class="grid-responsive">
        <!-- Populated dynamically -->
      </div>

      <!-- Empty State -->
      <div id="wishlist-empty-state" class="card" style="display: none; padding: 60px 24px; text-align: center; border-radius: 24px;">
        <div style="font-size: 4rem; margin-bottom: 16px;">❤️</div>
        <h2 style="font-size: 1.4rem; font-weight: 800; color: #0f172a; margin-bottom: 8px;">Your Wishlist is Empty</h2>
        <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 24px;">
          Save favorite pulses, rice, dairy, and oils to easily re-order whenever stock runs low!
        </p>
        <a href="products.html" class="btn btn-primary" style="margin: 0 auto;">
          Browse All Essentials
        </a>
      </div>

    </div>
  </main>

  <!-- Common Footer Shell -->
  <div id="vk-footer-container"></div>

  <!-- Page Logic Script -->
  <script type="module" src="./js/pages/wishlist.js"></script>
</body>
</html>
