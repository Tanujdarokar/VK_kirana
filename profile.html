<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <title>My Account - Apni Kirana</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="container">
      <div class="top-bar-left"><span><i class="fas fa-truck-fast"></i> 15-Min Instant Kirana Delivery</span></div>
      <div class="top-bar-right">
        <div class="lang-switcher">
          <button class="lang-btn active" data-lang="en">English</button>
          <button class="lang-btn" data-lang="hi">हिंदी</button>
        </div>
        <button class="theme-toggle-btn"><i class="fas fa-moon"></i></button>
      </div>
    </div>
  </div>

  <!-- Navbar -->
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo-brand">
        <div class="logo-icon"><i class="fas fa-shopping-basket"></i></div>
        <div class="logo-text">
          <h1 data-i18n="siteName">Apni Kirana</h1>
          <span data-i18n="tagline">Aapki Apni Dukan, Ab Online!</span>
        </div>
      </a>
      <div class="nav-actions">
        <a href="cart.html" class="btn btn-primary"><i class="fas fa-shopping-cart"></i> Cart</a>
      </div>
    </div>
  </header>

  <main style="padding: 40px 0 80px;">
    <div class="container" style="max-width: 840px;">

      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px;">
        <div>
          <h1 style="font-size: 1.8rem; font-weight: 800;">My Profile & Saved Address</h1>
          <p style="color: var(--text-muted); font-size: 0.88rem;">Manage your profile information and delivery preferences</p>
        </div>

        <button id="logout-btn" class="btn btn-outline" style="color: var(--danger-color); border-color: var(--danger-color);">
          <i class="fas fa-right-from-bracket"></i> Logout
        </button>
      </div>

      <!-- Quick Shortcuts Grid -->
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px;">
        <a href="orders.html" class="card" style="display: flex; align-items: center; gap: 16px; padding: 20px;">
          <div style="width: 48px; height: 48px; border-radius: var(--radius-md); background: var(--secondary-color); color: var(--primary-color); display: flex; align-items: center; justify-content: center; font-size: 1.3rem;">
            <i class="fas fa-box"></i>
          </div>
          <div>
            <div style="font-weight: 800; font-size: 1.1rem;">My Orders</div>
            <div style="font-size: 0.8rem; color: var(--text-muted);">View past purchases & status</div>
          </div>
        </a>

        <a href="cart.html" class="card" style="display: flex; align-items: center; gap: 16px; padding: 20px;">
          <div style="width: 48px; height: 48px; border-radius: var(--radius-md); background: #FFF3E0; color: #E65100; display: flex; align-items: center; justify-content: center; font-size: 1.3rem;">
            <i class="fas fa-shopping-basket"></i>
          </div>
          <div>
            <div style="font-weight: 800; font-size: 1.1rem;">Active Cart</div>
            <div style="font-size: 0.8rem; color: var(--text-muted);">Checkout active items</div>
          </div>
        </a>
      </div>

      <!-- Profile Edit Form -->
      <div class="card" style="padding: 28px;">
        <h3 style="font-size: 1.15rem; font-weight: 800; margin-bottom: 20px; color: var(--primary-color);">
          <i class="fas fa-user-gear"></i> Personal Information & Address
        </h3>

        <form id="profile-form" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px;">
          <div>
            <label style="font-size: 0.8rem; font-weight: 700;">Full Name *</label>
            <input type="text" id="prof-name" required style="width: 100%; padding: 10px 12px; border-radius: var(--radius-sm);" />
          </div>

          <div>
            <label style="font-size: 0.8rem; font-weight: 700;">Email Address *</label>
            <input type="email" id="prof-email" required style="width: 100%; padding: 10px 12px; border-radius: var(--radius-sm);" />
          </div>

          <div>
            <label style="font-size: 0.8rem; font-weight: 700;">Phone Number *</label>
            <input type="tel" id="prof-phone" required style="width: 100%; padding: 10px 12px; border-radius: var(--radius-sm);" />
          </div>

          <div>
            <label style="font-size: 0.8rem; font-weight: 700;">House / Flat Number</label>
            <input type="text" id="prof-house" style="width: 100%; padding: 10px 12px; border-radius: var(--radius-sm);" />
          </div>

          <div style="grid-column: 1 / -1;">
            <label style="font-size: 0.8rem; font-weight: 700;">Street / Area Address</label>
            <input type="text" id="prof-street" style="width: 100%; padding: 10px 12px; border-radius: var(--radius-sm);" />
          </div>

          <div>
            <label style="font-size: 0.8rem; font-weight: 700;">City</label>
            <input type="text" id="prof-city" style="width: 100%; padding: 10px 12px; border-radius: var(--radius-sm);" />
          </div>

          <div>
            <label style="font-size: 0.8rem; font-weight: 700;">State</label>
            <input type="text" id="prof-state" style="width: 100%; padding: 10px 12px; border-radius: var(--radius-sm);" />
          </div>

          <div>
            <label style="font-size: 0.8rem; font-weight: 700;">PIN Code (6 digits)</label>
            <input type="text" id="prof-pincode" style="width: 100%; padding: 10px 12px; border-radius: var(--radius-sm);" />
          </div>

          <div style="grid-column: 1 / -1; margin-top: 10px;">
            <button type="submit" class="btn btn-primary"><i class="fas fa-floppy-disk"></i> Save Profile Changes</button>
          </div>
        </form>
      </div>

    </div>
  </main>

  <footer class="footer"><div class="container"><div class="footer-bottom">© 2025 Apni Kirana</div></div></footer>

  <script src="./js/language.js"></script>
  <script src="./js/products.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/main.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!window.Auth || !window.Auth.isLoggedIn()) {
        window.location.href = "login.html";
        return;
      }

      const user = window.Auth.getUser();
      if (user) {
        document.getElementById('prof-name').value = user.name || '';
        document.getElementById('prof-email').value = user.email || '';
        document.getElementById('prof-phone').value = user.phone || '';
        if (user.address) {
          document.getElementById('prof-house').value = user.address.house || '';
          document.getElementById('prof-street').value = user.address.street || '';
          document.getElementById('prof-city').value = user.address.city || '';
          document.getElementById('prof-state').value = user.address.state || '';
          document.getElementById('prof-pincode').value = user.address.pincode || '';
        }
      }

      document.getElementById('profile-form')?.addEventListener('submit', (e) => {
        e.preventDefault();
        const updated = {
          name: document.getElementById('prof-name').value,
          email: document.getElementById('prof-email').value,
          phone: document.getElementById('prof-phone').value,
          address: {
            house: document.getElementById('prof-house').value,
            street: document.getElementById('prof-street').value,
            city: document.getElementById('prof-city').value,
            state: document.getElementById('prof-state').value,
            pincode: document.getElementById('prof-pincode').value
          }
        };

        window.Auth.updateProfile(updated);
      });

      document.getElementById('logout-btn')?.addEventListener('click', () => {
        window.Auth.logout();
        window.location.href = "index.html";
      });
    });
  </script>
</body>
</html>
