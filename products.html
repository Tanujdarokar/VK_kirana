<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <title>All Groceries & Daily Kirana - VKCommerce</title>
  <meta name="description" content="Browse our complete catalog of fresh grains, pulses, dairy, oils, and spices with instant 15-minute delivery." />
  <link rel="canonical" href="https://tanujdarokar.github.io/VK_kirana/products.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="VK Kirana" />
  <meta property="og:url" content="https://tanujdarokar.github.io/VK_kirana/products.html" />
  <meta property="og:title" content="All Groceries &amp; Daily Kirana - VKCommerce" />
  <meta property="og:description" content="Browse our complete catalog of fresh grains, pulses, dairy, oils, and spices with instant 15-minute delivery." />
  <meta property="og:image" content="https://tanujdarokar.github.io/VK_kirana/social-preview.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="VK Kirana - fresh daily groceries at your doorstep" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="All Groceries &amp; Daily Kirana - VKCommerce" />
  <meta name="twitter:description" content="Browse our complete catalog of fresh grains, pulses, dairy, oils, and spices with instant 15-minute delivery." />
  <meta name="twitter:image" content="https://tanujdarokar.github.io/VK_kirana/social-preview.png" />
  <link rel="stylesheet" href="./css/style.css" />
  <script src="https://unpkg.com/lucide@latest" defer></script>
</head>
<body>
  <!-- Common Navbar Shell -->
  <div id="vk-navbar-container"></div>

  <main style="padding: 32px 0 60px;">
    <div class="container">
      <!-- Breadcrumb & Title -->
      <div style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #64748b; margin-bottom: 12px;">
        <a href="index.html" style="color: #047857; font-weight: 600;">Home</a>
        <span>›</span>
        <span style="font-weight: 700; color: #0f172a;">All Grocery Essentials</span>
      </div>

      <div style="display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 24px;">
        <div>
          <h1 style="font-size: 1.85rem; font-weight: 900; color: #0f172a;">Daily Kirana Catalog</h1>
          <p style="color: #64748b; font-size: 0.92rem;">Direct mandi procurement, wholesale rates & express 15-min delivery</p>
        </div>

        <div style="display: flex; align-items: center; gap: 12px;">
          <label style="font-size: 0.85rem; font-weight: 700; color: #475569;">Sort By:</label>
          <select id="sort-select" style="padding: 8px 14px; border-radius: 10px; border: 1.5px solid #cbd5e1; background: white; font-size: 0.88rem; font-weight: 600; color: #0f172a;">
            <option value="featured">Featured Essentials</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="rating">Highest Rated</option>
            <option value="discount">Biggest Discount</option>
          </select>
        </div>
      </div>

      <!-- Main Layout with Filters Sidebar & Product Grid -->
      <div style="display: grid; grid-template-columns: 260px 1fr; gap: 1.75rem; align-items: start;" class="layout-2col-responsive">
        
        <!-- Filter Sidebar -->
        <aside class="card" style="padding: 20px; border-radius: 18px; position: sticky; top: 100px;">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px;">
            <h3 style="font-size: 1.1rem; font-weight: 800;">Filters</h3>
            <button id="clear-filters-btn" style="font-size: 0.78rem; font-weight: 700; color: #ef4444; background: none; border: none; cursor: pointer;">
              Reset All
            </button>
          </div>

          <!-- Category Filter -->
          <div style="margin-bottom: 20px;">
            <div style="font-size: 0.85rem; font-weight: 800; color: #0f172a; margin-bottom: 10px;">Category</div>
            <div id="filter-categories-list" style="display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow-y: auto;">
              <!-- Populated dynamically -->
            </div>
          </div>

          <!-- Max Price Slider -->
          <div style="margin-bottom: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px;">
              <span style="font-size: 0.85rem; font-weight: 800; color: #0f172a;">Max Price</span>
              <span id="price-slider-val" style="font-size: 0.9rem; font-weight: 800; color: #047857;">₹1000</span>
            </div>
            <input type="range" id="price-slider" min="20" max="1000" step="10" value="1000" style="width: 100%; accent-color: #047857;" />
          </div>

          <!-- Checkbox Offers -->
          <div style="display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #f1f5f9; padding-top: 14px;">
            <label style="display: flex; align-items: center; gap: 8px; font-size: 0.88rem; cursor: pointer;">
              <input type="checkbox" id="filter-deals-only" style="accent-color: #047857; width: 16px; height: 16px;" />
              <span style="font-weight: 600;">🔥 Deals & Offers Only</span>
            </label>
            <label style="display: flex; align-items: center; gap: 8px; font-size: 0.88rem; cursor: pointer;">
              <input type="checkbox" id="filter-fresh-only" style="accent-color: #047857; width: 16px; height: 16px;" />
              <span style="font-weight: 600;">🥬 Taaza Mandi Batch</span>
            </label>
          </div>
        </aside>

        <!-- Product Grid Area -->
        <div>
          <div style="margin-bottom: 16px; font-size: 0.88rem; font-weight: 700; color: #64748b;">
            Showing <span id="products-count" style="color: #047857;">0</span> grocery products
          </div>

          <div id="catalog-products-grid" class="grid-responsive">
            <!-- Populated dynamically -->
          </div>

          <!-- Empty State -->
          <div id="catalog-empty-state" class="card" style="display: none; padding: 48px 24px; text-align: center; border-radius: 20px;">
            <div style="font-size: 3rem; margin-bottom: 12px;">🔍</div>
            <h3 style="font-size: 1.25rem; font-weight: 800; color: #0f172a; margin-bottom: 8px;">No matching grocery found</h3>
            <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 20px;">Try relaxing your filters or searching for another staple name.</p>
            <button id="empty-reset-btn" class="btn btn-primary" style="margin: 0 auto;">
              Clear All Filters
            </button>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Common Footer Shell -->
  <div id="vk-footer-container"></div>

  <!-- Page Logic Script -->
  <script type="module" src="./js/pages/products.js"></script>
</body>
</html>
