<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <title>Order Placed - Apni Kirana</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/cart.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="container">
      <div class="top-bar-left"><span><i class="fas fa-truck-fast"></i> 15-Min Instant Kirana Delivery</span></div>
      <div class="top-bar-right">
        <div class="lang-switcher">
          <button class="lang-btn active" data-lang="en">English</button>
          <button class="lang-btn" data-lang="hi">हिंदी</button>
        </div>
        <button class="theme-toggle-btn"><i class="fas fa-moon"></i></button>
      </div>
    </div>
  </div>

  <!-- Navbar -->
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo-brand">
        <div class="logo-icon"><i class="fas fa-shopping-basket"></i></div>
        <div class="logo-text">
          <h1 data-i18n="siteName">Apni Kirana</h1>
          <span data-i18n="tagline">Aapki Apni Dukan, Ab Online!</span>
        </div>
      </a>
      <div class="nav-actions">
        <a href="index.html" class="btn btn-outline"><i class="fas fa-house"></i> Home</a>
      </div>
    </div>
  </header>

  <main style="padding: 40px 0 80px;">
    <div class="container" style="max-width: 780px;">
      <div id="order-success-card"></div>
    </div>
  </main>

  <footer class="footer"><div class="container"><div class="footer-bottom">© 2025 Apni Kirana</div></div></footer>

  <script src="./js/language.js"></script>
  <script src="./js/products.js"></script>
  <script src="./js/cart.js"></script>
  <script src="./js/checkout.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/main.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const orderId = urlParams.get('orderId');

      const card = document.getElementById('order-success-card');
      if (!card || !window.Checkout) return;

      const order = orderId ? window.Checkout.getOrderById(orderId) : window.Checkout.getOrders()[0];

      if (!order) {
        card.innerHTML = `<div class="card" style="padding: 40px; text-align: center;"><h2>Order Not Found</h2><a href="index.html" class="btn btn-primary">Return to Home</a></div>`;
        return;
      }

      card.innerHTML = `
        <div class="card" style="text-align: center; padding: 36px 28px; background: linear-gradient(135deg, #E8F5E9 0%, #FFFFFF 100%); margin-bottom: 24px;">
          <div style="width: 72px; height: 72px; border-radius: 50%; background: var(--primary-color); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; margin: 0 auto 16px; box-shadow: 0 8px 20px rgba(22, 132, 71, 0.3);">
            <i class="fas fa-circle-check"></i>
          </div>
          <span class="badge" style="background: var(--secondary-color); color: var(--primary-dark); font-size: 0.8rem; padding: 4px 12px; margin-bottom: 8px;">Order Confirmed</span>
          <h1 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 8px;" data-i18n="orderSuccessTitle">Order Placed Successfully!</h1>
          <p style="color: var(--text-muted); font-size: 0.92rem; margin-bottom: 16px;">Thank you for shopping with Apni Kirana. Your groceries are being packed with care.</p>

          <div style="display: inline-flex; align-items: center; gap: 8px; background: #ffffff; border: 1px solid var(--border-color); padding: 8px 16px; border-radius: var(--radius-md);">
            <span style="font-size: 0.85rem; color: var(--text-muted);" data-i18n="orderIdLabel">Order Reference ID:</span>
            <strong style="font-size: 1.1rem; color: var(--primary-color);">${order.id}</strong>
          </div>
        </div>

        <div class="card" style="padding: 24px; margin-bottom: 24px;">
          <h3 style="font-size: 1.1rem; font-weight: 800; margin-bottom: 16px;">Delivery Details</h3>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; font-size: 0.88rem;">
            <div>
              <div style="color: var(--text-muted); font-size: 0.78rem; font-weight: 700; text-transform: uppercase;">Delivering To:</div>
              <strong style="color: var(--text-color);">${order.customer.name}</strong>
              <div>${order.customer.address.house}, ${order.customer.address.street}</div>
              <div>${order.customer.address.city}, ${order.customer.address.state} - ${order.customer.address.pincode}</div>
              <div style="color: var(--text-muted); font-size: 0.8rem;">Phone: ${order.customer.phone}</div>
            </div>

            <div>
              <div style="color: var(--text-muted); font-size: 0.78rem; font-weight: 700; text-transform: uppercase;">Slot & Payment:</div>
              <strong>${order.deliverySlot}</strong>
              <div style="margin-top: 4px;">Payment Mode: <strong>${order.paymentMethod}</strong></div>
              <div style="color: var(--primary-color); font-weight: 700; margin-top: 4px;">Status: ${order.status}</div>
            </div>
          </div>
        </div>

        <div style="display: flex; gap: 12px; justify-content: center;">
          <a href="track-order.html?orderId=${order.id}" class="btn btn-primary" data-i18n="trackOrderBtn">
            <i class="fas fa-truck-fast"></i> Track Order Status
          </a>
          <a href="shop.html" class="btn btn-outline" data-i18n="shopNow">
            Continue Shopping
          </a>
        </div>
      `;
    });
  </script>
</body>
</html>
