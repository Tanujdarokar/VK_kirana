<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <title>Shopping Cart - Apni Kirana</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/cart.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="container">
      <div class="top-bar-left"><span><i class="fas fa-truck-fast"></i> 15-Min Instant Kirana Delivery</span></div>
      <div class="top-bar-right">
        <div class="lang-switcher">
          <button class="lang-btn active" data-lang="en">English</button>
          <button class="lang-btn" data-lang="hi">हिंदी</button>
        </div>
        <button class="theme-toggle-btn"><i class="fas fa-moon"></i></button>
      </div>
    </div>
  </div>

  <!-- Navbar -->
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo-brand">
        <div class="logo-icon"><i class="fas fa-shopping-basket"></i></div>
        <div class="logo-text">
          <h1 data-i18n="siteName">Apni Kirana</h1>
          <span data-i18n="tagline">Aapki Apni Dukan, Ab Online!</span>
        </div>
      </a>

      <div class="search-bar-wrap">
        <i class="fas fa-search search-icon-btn"></i>
        <input type="text" class="search-input global-search-input" placeholder="Search atta, rice, oil, milk, spices..." data-i18n-placeholder="searchPlaceholder" />
        <div class="search-dropdown"></div>
      </div>

      <div class="nav-actions">
        <a href="login.html" class="btn btn-outline" id="nav-login-btn"><i class="fas fa-user"></i> <span data-i18n="navLogin">Login / Account</span></a>
        <a href="cart.html" class="btn btn-primary" style="position: relative;"><i class="fas fa-shopping-cart"></i> <span class="cart-total-price">₹0</span><span class="badge cart-count-badge" style="position: absolute; top: -6px; right: -6px; background: #FF9800; color: #fff; font-size: 0.7rem; border-radius: 50%; padding: 2px 6px;">0</span></a>
      </div>
    </div>
  </header>

  <main style="padding: 30px 0 60px;">
    <div class="container">
      <div style="margin-bottom: 20px;">
        <h1 style="font-size: 1.8rem; font-weight: 800;" data-i18n="cartTitle">Your Kirana Shopping Cart</h1>
        <p style="color: var(--text-muted); font-size: 0.88rem;">Review your items before proceeding to checkout</p>
      </div>

      <div id="cart-content-wrap"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom"><span data-i18n="footerRights">© 2025 Apni Kirana. All rights reserved.</span></div>
    </div>
  </footer>

  <script src="./js/language.js"></script>
  <script src="./js/products.js"></script>
  <script src="./js/cart.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/main.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      function renderCartPage() {
        const wrap = document.getElementById('cart-content-wrap');
        if (!wrap || !window.Cart) return;

        const bill = window.Cart.getBillDetails();

        if (bill.items.length === 0) {
          wrap.innerHTML = `
            <div class="card" style="padding: 50px; text-align: center;">
              <i class="fas fa-shopping-basket" style="font-size: 3rem; color: var(--text-muted); margin-bottom: 16px;"></i>
              <h2 data-i18n="emptyCartMsg">Your shopping cart is empty!</h2>
              <p style="color: var(--text-muted); margin: 8px 0 20px;">Browse our 50+ fresh grocery items and add essentials to your cart.</p>
              <a href="shop.html" class="btn btn-primary" data-i18n="shopNow">Shop Now</a>
            </div>
          `;
          return;
        }

        const lang = window.LangEngine ? window.LangEngine.getLang() : 'en';

        wrap.innerHTML = `
          <!-- Free Delivery Progress Bar -->
          <div class="free-delivery-progress">
            <div style="display: flex; justify-content: space-between; font-weight: 700; font-size: 0.9rem; color: var(--primary-dark);">
              <span><i class="fas fa-truck-fast"></i> ${bill.amountNeededForFreeDelivery > 0 ? `Add <strong>₹${bill.amountNeededForFreeDelivery}</strong> more for FREE Delivery!` : '🎉 Congratulations! You unlocked FREE Delivery!'}</span>
              <span>${Math.round(bill.freeDeliveryProgress)}%</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" style="width: ${bill.freeDeliveryProgress}%;"></div>
            </div>
          </div>

          <div class="cart-layout">
            <!-- Left Items List -->
            <div class="card" style="padding: 0;">
              ${bill.items.map(item => `
                <div class="cart-item">
                  <img src="${item.product.image}" alt="${item.product.name}" />
                  <div style="flex: 1;">
                    <div style="font-size: 0.9rem; font-weight: 700;">${lang === 'hi' ? item.product.hindiName : item.product.name}</div>
                    <div style="font-size: 0.78rem; color: var(--text-muted);">${item.product.unit} • ₹${item.unitPrice} / unit</div>
                  </div>
                  <div class="quantity-control">
                    <button onclick="window.Cart.updateQuantity('${item.productId}', ${item.quantity - 1})">-</button>
                    <span>${item.quantity}</span>
                    <button onclick="window.Cart.updateQuantity('${item.productId}', ${item.quantity + 1})">+</button>
                  </div>
                  <div style="font-weight: 800; font-size: 1rem; width: 80px; text-align: right;">₹${item.itemSubtotal}</div>
                  <button onclick="window.Cart.removeFromCart('${item.productId}')" style="color: var(--danger-color); font-size: 0.9rem;"><i class="fas fa-trash-can"></i></button>
                </div>
              `).join('')}
            </div>

            <!-- Right Bill Summary -->
            <div>
              <div class="bill-summary">
                <h3 style="font-size: 1.1rem; font-weight: 800; margin-bottom: 16px;">Bill Details</h3>

                <div class="bill-row">
                  <span>Subtotal (${bill.totalItemsCount} items)</span>
                  <span>₹${bill.itemsTotal}</span>
                </div>

                ${bill.productSavings > 0 ? `
                  <div class="bill-row" style="color: var(--primary-color); font-weight: 700;">
                    <span>Product Savings</span>
                    <span>- ₹${bill.productSavings}</span>
                  </div>
                ` : ''}

                <div class="bill-row">
                  <span>Delivery Charge</span>
                  <span>${bill.deliveryFee === 0 ? '<strong style="color: var(--primary-color);">FREE</strong>' : `₹${bill.deliveryFee}`}</span>
                </div>

                <div class="bill-row">
                  <span>Handling & Packaging</span>
                  <span>₹${bill.handlingFee}</span>
                </div>

                ${bill.couponDiscount > 0 ? `
                  <div class="bill-row" style="color: var(--primary-color); font-weight: 700;">
                    <span>Coupon (${bill.appliedCoupon.code})</span>
                    <span>- ₹${bill.couponDiscount}</span>
                  </div>
                ` : ''}

                <div class="bill-row grand-total">
                  <span>Total Amount</span>
                  <span>₹${bill.grandTotal}</span>
                </div>

                <!-- Coupon Input -->
                <div style="margin: 16px 0;">
                  <div style="display: flex; gap: 8px;">
                    <input type="text" id="coupon-code-input" placeholder="Coupon Code" data-i18n-placeholder="couponPlaceholder" style="padding: 8px 12px; border-radius: var(--radius-sm); font-weight: 700; flex: 1;" />
                    <button id="apply-coupon-btn" class="btn btn-secondary btn-sm" data-i18n="applyCoupon">Apply</button>
                  </div>
                  <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 4px;">Use <strong>KIRANA10</strong> or <strong>WELCOME50</strong></div>
                </div>

                <a href="checkout.html" class="btn btn-primary" style="width: 100%; font-size: 1rem;" data-i18n="proceedCheckout">
                  Proceed to Checkout <i class="fas fa-arrow-right"></i>
                </a>
              </div>
            </div>
          </div>
        `;

        document.getElementById('apply-coupon-btn')?.addEventListener('click', () => {
          const val = document.getElementById('coupon-code-input')?.value;
          if (val) window.Cart.applyCouponCode(val);
        });
      }

      window.addEventListener('cartUpdated', renderCartPage);
      renderCartPage();
    });
  </script>
</body>
</html>
