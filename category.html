<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <title>Category Groceries - VKCommerce</title>
  <meta name="description" content="Browse authentic category groceries with fast 15-minute delivery." />
  <link rel="canonical" href="https://tanujdarokar.github.io/VK_kirana/category.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="VK Kirana" />
  <meta property="og:url" content="https://tanujdarokar.github.io/VK_kirana/category.html" />
  <meta property="og:title" content="Category Groceries - VKCommerce" />
  <meta property="og:description" content="Browse authentic category groceries with fast 15-minute delivery." />
  <meta property="og:image" content="https://tanujdarokar.github.io/VK_kirana/social-preview.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="VK Kirana - fresh daily groceries at your doorstep" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Category Groceries - VKCommerce" />
  <meta name="twitter:description" content="Browse authentic category groceries with fast 15-minute delivery." />
  <meta name="twitter:image" content="https://tanujdarokar.github.io/VK_kirana/social-preview.png" />
  <link rel="stylesheet" href="./css/style.css" />
  <script src="https://unpkg.com/lucide@latest" defer></script>
</head>
<body>
  <!-- Common Navbar Shell -->
  <div id="vk-navbar-container"></div>

  <main style="padding: 32px 0 60px;">
    <div class="container">
      <!-- Breadcrumb -->
      <div style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #64748b; margin-bottom: 16px;">
        <a href="index.html" style="color: #047857; font-weight: 600;">Home</a>
        <span>›</span>
        <a href="products.html" style="color: #047857; font-weight: 600;">Categories</a>
        <span>›</span>
        <span id="breadcrumb-category-name" style="font-weight: 700; color: #0f172a;">Category</span>
      </div>

      <!-- Category Hero Banner -->
      <div id="category-banner-card" class="card" style="padding: 32px; border-radius: 24px; margin-bottom: 32px; display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap;">
        <div style="flex: 1; min-width: 280px;">
          <span id="category-badge" class="badge badge-popular" style="margin-bottom: 10px;">Category</span>
          <h1 id="category-title" style="font-size: 2.2rem; font-weight: 900; color: #0f172a; margin-bottom: 8px;">
            Loading Category...
          </h1>
          <p id="category-desc" style="color: #64748b; font-size: 0.95rem; line-height: 1.5; max-width: 560px;">
            Loading details...
          </p>
          <div style="margin-top: 14px; font-size: 0.85rem; font-weight: 700; color: #047857;">
            ⚡ 15-Min Guaranteed Local Mandi Delivery
          </div>
        </div>

        <div id="category-image-wrap" style="width: 140px; height: 140px; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
          <img id="category-image" src="" alt="Category" style="width: 100%; height: 100%; object-fit: cover;" />
        </div>
      </div>

      <!-- Products Grid Header -->
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;">
        <div style="font-weight: 800; font-size: 1.1rem; color: #0f172a;">
          Available Products (<span id="category-item-count">0</span>)
        </div>

        <div style="display: flex; align-items: center; gap: 10px;">
          <label style="font-size: 0.85rem; font-weight: 700; color: #475569;">Sort By:</label>
          <select id="cat-sort-select" style="padding: 8px 12px; border-radius: 10px; border: 1.5px solid #cbd5e1; background: white; font-size: 0.85rem; font-weight: 600;">
            <option value="featured">Featured</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="rating">Highest Rated</option>
          </select>
        </div>
      </div>

      <!-- Products Grid -->
      <div id="category-products-grid" class="grid-responsive">
        <!-- Populated dynamically -->
      </div>
    </div>
  </main>

  <!-- Common Footer Shell -->
  <div id="vk-footer-container"></div>

  <!-- Page Logic Script -->
  <script type="module" src="./js/pages/category.js"></script>
</body>
</html>
