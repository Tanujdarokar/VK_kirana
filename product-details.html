<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <title>Product Details - Apni Kirana</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/shop.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="container">
      <div class="top-bar-left">
        <span><i class="fas fa-truck-fast"></i> 15-Min Instant Kirana Delivery</span>
      </div>
      <div class="top-bar-right">
        <div class="lang-switcher">
          <button class="lang-btn active" data-lang="en">English</button>
          <button class="lang-btn" data-lang="hi">हिंदी</button>
        </div>
        <button class="theme-toggle-btn"><i class="fas fa-moon"></i></button>
      </div>
    </div>
  </div>

  <!-- Navbar -->
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo-brand">
        <div class="logo-icon"><i class="fas fa-shopping-basket"></i></div>
        <div class="logo-text">
          <h1 data-i18n="siteName">Apni Kirana</h1>
          <span data-i18n="tagline">Aapki Apni Dukan, Ab Online!</span>
        </div>
      </a>

      <div class="search-bar-wrap">
        <i class="fas fa-search search-icon-btn"></i>
        <input type="text" class="search-input global-search-input" placeholder="Search atta, rice, oil, milk, spices..." data-i18n-placeholder="searchPlaceholder" />
        <div class="search-dropdown"></div>
      </div>

      <div class="nav-actions">
        <a href="login.html" class="btn btn-outline" id="nav-login-btn"><i class="fas fa-user"></i> <span data-i18n="navLogin">Login / Account</span></a>
        <a href="cart.html" class="btn btn-primary" style="position: relative;"><i class="fas fa-shopping-cart"></i> <span class="cart-total-price">₹0</span><span class="badge cart-count-badge" style="position: absolute; top: -6px; right: -6px; background: #FF9800; color: #fff; font-size: 0.7rem; border-radius: 50%; padding: 2px 6px;">0</span></a>
      </div>
    </div>
  </header>

  <main style="padding: 30px 0 60px;">
    <div class="container">
      <div id="product-detail-container"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom"><span data-i18n="footerRights">© 2025 Apni Kirana. All rights reserved.</span></div>
    </div>
  </footer>

  <script src="./js/language.js"></script>
  <script src="./js/products.js"></script>
  <script src="./js/cart.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/main.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const prodId = urlParams.get('id') || 'p1';

      if (window.ProductStore) {
        const product = window.ProductStore.getProducts().find(p => p.id === prodId);
        const container = document.getElementById('product-detail-container');

        if (!product || !container) {
          container.innerHTML = `<div class="card" style="padding: 40px; text-align: center;"><h2>Product Not Found</h2><a href="shop.html" class="btn btn-primary">Back to Shop</a></div>`;
          return;
        }

        const lang = window.LangEngine ? window.LangEngine.getLang() : 'en';
        let qty = 1;

        container.innerHTML = `
          <div className="card" style="padding: 30px; margin-bottom: 30px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px;">
            <div style="background: var(--surface-color); border-radius: var(--radius-md); padding: 30px; display: flex; align-items: center; justify-content: center;">
              <img src="${product.image}" alt="${product.name}" style="max-height: 280px; object-fit: contain;" />
            </div>

            <div>
              <div style="font-size: 0.8rem; font-weight: 700; color: var(--primary-color); text-transform: uppercase;">${product.brand}</div>
              <h1 style="font-size: 1.6rem; font-weight: 800; margin: 6px 0;">${lang === 'hi' ? product.hindiName : product.name}</h1>
              <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px;">Unit Size: ${product.unit}</div>

              <div style="display: flex; align-items: baseline; gap: 10px; margin-bottom: 16px;">
                <span style="font-size: 1.8rem; font-weight: 800; color: var(--text-color);">₹${product.discountPrice || product.price}</span>
                ${product.price > product.discountPrice ? `<span style="font-size: 1.1rem; color: var(--text-muted); text-decoration: line-through;">₹${product.price}</span>` : ''}
              </div>

              <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 20px;">${product.description}</p>

              <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 24px;">
                <div class="quantity-control">
                  <button id="qty-minus">-</button>
                  <span id="qty-val">1</span>
                  <button id="qty-plus">+</button>
                </div>

                <button id="add-to-cart-btn" class="btn btn-primary" style="flex: 1;">
                  <i class="fas fa-shopping-bag"></i> Add to Cart
                </button>
              </div>

              <div style="background: var(--secondary-color); padding: 12px 16px; border-radius: var(--radius-md); font-size: 0.85rem; color: var(--primary-dark); font-weight: 600;">
                <i class="fas fa-truck-fast"></i> 15-Minute Home Delivery Available
              </div>
            </div>
          </div>
        `;

        document.getElementById('qty-minus')?.addEventListener('click', () => {
          if (qty > 1) {
            qty--;
            document.getElementById('qty-val').textContent = qty;
          }
        });

        document.getElementById('qty-plus')?.addEventListener('click', () => {
          qty++;
          document.getElementById('qty-val').textContent = qty;
        });

        document.getElementById('add-to-cart-btn')?.addEventListener('click', () => {
          window.Cart.addToCart(product.id, qty);
        });
      }
    });
  </script>
</body>
</html>
